        const langMenu = document.getElementById('lang-menu');
        const langToggle = document.getElementById('lang-toggle');
        const currentLangCode = document.getElementById('current-lang-code');

        function applyLanguage(langCode) {
            const selected = content[langCode] || content['en'];
            document.documentElement.lang = langCode;
            document.title = selected.title;
            document.getElementById('meta-desc').setAttribute('content', selected.desc);
            document.getElementById('og-title').setAttribute('content', selected.title);
            document.getElementById('og-desc').setAttribute('content', selected.desc);
            document.getElementById('support-text').innerText = selected.support;
            currentLangCode.innerText = langCode.toUpperCase();

            document.querySelectorAll('.lang-option').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === langCode);
            });

            try {
                localStorage.setItem('vw_lang', langCode);
            } catch (e) {}
        }

        // Menüyü alfabetik sıraya göre 28 dil ile doldur
        Object.keys(content)
            .sort((a, b) => content[a].name.localeCompare(content[b].name))
            .forEach(code => {
                const btn = document.createElement('button');
                btn.className = 'lang-option';
                btn.dataset.lang = code;
                btn.innerHTML = `<span>${content[code].name}</span><span style="font-size:0.75rem;opacity:0.5;">${code.toUpperCase()}</span>`;
                btn.addEventListener('click', () => {
                    applyLanguage(code);
                    langMenu.classList.remove('open');
                });
                langMenu.appendChild(btn);
            });

        // Menü aç/kapat
        langToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            langMenu.classList.toggle('open');
        });

        // Dışarı tıklanınca menüyü kapat
        document.addEventListener('click', () => {
            langMenu.classList.remove('open');
        });

        // İlk açılış: Kayıtlı tercih varsa onu, yoksa İngilizceyi yükle
        let savedLang = 'en';
        try {
            const stored = localStorage.getItem('vw_lang');
            if (stored && content[stored]) savedLang = stored;
        } catch (e) {}

        applyLanguage(savedLang);
    </script>
